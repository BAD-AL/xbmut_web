<svg xmlns="http://www.w3.org/2000/svg" width="400" height="120" viewBox="0 0 400 120">
    <defs>
        <!-- The deep green liquid interior -->
        <radialGradient id="orbGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
            <stop offset="0%" style="stop-color:#25f20f;stop-opacity:1" />
            <stop offset="60%" style="stop-color:#107c10;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#021a02;stop-opacity:1" />
        </radialGradient>
        
        <!-- Neon Glow for the text and orb -->
        <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <!-- Glossy Highlight -->
        <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6" />
            <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
        </linearGradient>

        <!-- Text Gradient -->
        <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#25f20f;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#107c10;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Main Orb (The Icon) -->
    <g transform="translate(10, 10)">
        <circle cx="50" cy="50" r="48" fill="url(#orbGrad)" stroke="#050505" stroke-width="1" />
        
        <!-- The X Engraving -->
        <g filter="url(#neonGlow)">
            <path d="M30,30 L70,70 M70,30 L30,70" stroke="#25f20f" stroke-width="12" stroke-linecap="round" />
            <path d="M30,30 L70,70 M70,30 L30,70" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5" />
        </g>

        <!-- Top Gloss Bubble -->
        <ellipse cx="50" cy="25" rx="30" ry="15" fill="url(#gloss)" opacity="0.4" />
    </g>

    <!-- XBMUT Text -->
    <g transform="translate(120, 75)">
        <!-- Neon Glow Behind Text -->
        <text font-family="Arial Black, sans-serif" font-weight="900" font-size="70" fill="#25f20f" filter="url(#neonGlow)" letter-spacing="-2">XBMUT</text>
        <!-- Main Text with Gradient -->
        <text font-family="Arial Black, sans-serif" font-weight="900" font-size="70" fill="url(#textGrad)" letter-spacing="-2">XBMUT</text>
        
        <!-- Subtle reflections on text -->
        <text font-family="Arial Black, sans-serif" font-weight="900" font-size="70" fill="#ffffff" opacity="0.2" letter-spacing="-2">XBMUT</text>
    </g>

    <!-- Decorative Underline/Bar -->
    <path d="M125,95 L380,95 L390,105" fill="none" stroke="#25f20f" stroke-width="3" opacity="0.7" filter="url(#neonGlow)" />
</svg>
