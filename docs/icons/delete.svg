<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
    <defs>
        <!-- Standard Xbox Green Gradient -->
        <linearGradient id="deleteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#25f20f;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#107c10;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Trash Can Body (Tapered for more detail) -->
    <path fill="url(#deleteGrad)" stroke="#050505" stroke-width="0.6" 
          d="M7,9 L17,9 L15.5,21 C15.4,21.6 14.9,22 14.3,22 L9.7,22 C9.1,22 8.6,21.6 8.5,21 L7,9 Z" />

    <!-- Vertical Corrugation Lines (Texture) -->
    <g stroke="#000000" stroke-width="0.3" opacity="0.2">
        <line x1="9.5" y1="10" x2="10.5" y2="21" />
        <line x1="12" y1="10" x2="12" y2="21" />
        <line x1="14.5" y1="10" x2="13.5" y2="21" />
    </g>

    <!-- Interior Shadow -->
    <path d="M7,9 L17,9 L16.8,11 L7.2,11 Z" fill="black" opacity="0.1" />

    <!-- Trash Can Lid -->
    <g transform="translate(0, -1)">
        <!-- Lid Rim -->
        <rect x="6" y="8" width="12" height="2" rx="0.5" fill="url(#deleteGrad)" stroke="#050505" stroke-width="0.6" />
        <!-- Raised Lid Center -->
        <path fill="url(#deleteGrad)" stroke="#050505" stroke-width="0.6" 
              d="M7.5,8 C7.5,6.5 8.5,6 9.5,6 L14.5,6 C15.5,6 16.5,6.5 16.5,8 L7.5,8 Z" />
        <!-- Lid Detail Line -->
        <line x1="8.5" y1="7.2" x2="15.5" y2="7.2" stroke="#050505" stroke-width="0.2" opacity="0.3" />
        
        <!-- Lid Handle -->
        <rect x="10.5" y="4.5" width="3" height="1.5" rx="0.5" fill="#050505" />
        <!-- Handle Inner Detail -->
        <rect x="11" y="5" width="2" height="0.5" rx="0.2" fill="url(#deleteGrad)" opacity="0.8" />
    </g>
    
    <!-- Bottom Rim Shadow -->
    <path d="M9.5,22 L14.5,22 L14,22.8 L10,22.8 Z" fill="#050505" opacity="0.3" />
</svg>
