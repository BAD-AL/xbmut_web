<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
    <defs>
        <!-- Gradient for the main body of the can -->
        <linearGradient id="deleteBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#25f20f;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#107c10;stop-opacity:1" />
        </linearGradient>
        <!-- Gradient for the lid -->
        <linearGradient id="deleteLidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#25f20f;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#107c10;stop-opacity:1" />
        </linearGradient>
        <!-- Handle gradient (kept darker for detail) -->
        <linearGradient id="deleteHandleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#050505;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
        </linearGradient>
    </defs>
    <!-- Trash Can Lid -->
    <path fill="url(#deleteLidGrad)" stroke="#050505" stroke-width="0.7" d="M6,4c0-0.55,0.45-1,1-1h10c0.55,0,1,0.45,1,1h-12z"/>
    <!-- Trash Can Body -->
    <rect x="7" y="5" width="10" height="12" rx="2" fill="url(#deleteBodyGrad)" stroke="#050505" stroke-width="0.7"/>
    <!-- Handle -->
    <rect x="10" y="3" width="4" height="2" rx="1" fill="url(#deleteHandleGrad)" stroke="#050505" stroke-width="0.4"/>
</svg>