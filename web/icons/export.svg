<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
    <defs>
        <!-- Gradient for the box -->
        <linearGradient id="exportBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#25f20f;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#107c10;stop-opacity:1" />
        </linearGradient>
        <!-- Gradient for the arrow -->
        <linearGradient id="exportArrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#25f20f;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#107c10;stop-opacity:1" />
        </linearGradient>
    </defs>
    <!-- Box Shape -->
    <rect x="5" y="9" width="14" height="10" rx="1" fill="url(#exportBoxGrad)" stroke="#050505" stroke-width="0.7" />
    <!-- Arrow pointing up from the box -->
    <path fill="url(#exportArrowGrad)" stroke="#050505" stroke-width="0.7" d="M12,4 L15,7 L13.5,7 L13.5,9 L10.5,9 L10.5,7 L9,7 Z"/>
</svg>