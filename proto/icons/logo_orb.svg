<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <!-- The deep green liquid interior -->
        <radialGradient id="orbGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
            <stop offset="0%" style="stop-color:#25f20f;stop-opacity:1" />
            <stop offset="60%" style="stop-color:#107c10;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#021a02;stop-opacity:1" />
        </radialGradient>
        
        <!-- Neon Glow for the X -->
        <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <!-- Glossy Highlight -->
        <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6" />
            <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
        </linearGradient>
    </defs>

    <!-- Main Sphere -->
    <circle cx="50" cy="50" r="48" fill="url(#orbGrad)" stroke="#050505" stroke-width="1" />
    
    <!-- The X Engraving -->
    <g filter="url(#neonGlow)">
        <path d="M30,30 L70,70 M70,30 L30,70" stroke="#25f20f" stroke-width="12" stroke-linecap="round" />
        <path d="M30,30 L70,70 M70,30 L30,70" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    </g>

    <!-- Top Gloss Bubble -->
    <ellipse cx="50" cy="25" rx="30" ry="15" fill="url(#gloss)" opacity="0.4" />
</svg>
